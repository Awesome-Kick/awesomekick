<!doctype html>
<!--
  AwesomeKick in the browser: the noVNC view of the simulator plus its sound.
  Sound comes as raw 48 kHz s16le stereo over a WebSocket from scripts/awesomekick-audio.py (port 6081).
  Browsers only start audio after a click, hence the "Sound on" button.
  SPDX-License-Identifier: AGPL-3.0-or-later
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AwesomeKick</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  /* Slim bar above the panel, so nothing covers the simulator's keys */
  #bar { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 12px;
         background: #1a1a1c; border-bottom: 1px solid #333; color: #ccc; font-size: 14px; }
  #bar .name { font-weight: 600; color: #ddd; margin-right: auto; }
  iframe { border: 0; width: 100%; flex: 1 1 auto; display: block; }
  #sound { display: flex; align-items: center; gap: 10px; }
  #sound button { font: inherit; font-size: 14px; cursor: pointer; color: #111; background: #ffd23f;
                  border: 0; border-radius: 6px; padding: 4px 10px; }
  #sound.on button { background: #333; color: #eee; }
  #status { font-size: 12px; color: #aaa; min-width: 9em; }
</style>
</head>
<body>
<div id="bar"><span class="name">AwesomeKick</span>
  <div id="sound"><span id="status">sound off</span><button id="toggle">🔊 Sound on</button></div></div>
<iframe id="vnc" src="vnc.html?autoconnect=1&amp;resize=scale" allow="autoplay"></iframe>
<script>
(() => {
  const AUDIO_PORT = 6081;
  const TARGET = 0.06, MAX = 0.20;        // seconds buffered: aim / hard limit (drop older audio above)
  const box = document.getElementById('sound'), btn = document.getElementById('toggle'),
        status = document.getElementById('status');
  let ctx = null, ws = null, node = null, retry = null;
  let rate = 48000, ring = null, size = 0, rd = 0, wr = 0, priming = true;
  let bytes = 0, peak = 0, lastReport = 0;   // what arrives from the server, shown next to the button

  const buffered = () => (wr - rd + size) % size;

  function setupRing() {
    size = rate * 2;                       // 1 s per channel, interleaved stereo
    ring = new Float32Array(size); rd = wr = 0; priming = true;
  }

  function push(int16) {
    for (let i = 0; i < int16.length; i++) { ring[wr] = int16[i] / 32768; wr = (wr + 1) % size; }
    const limit = Math.floor(MAX * rate) * 2, keep = Math.floor(TARGET * rate) * 2;
    if (buffered() > limit) rd = (wr - keep + size) % size;   // too far behind: jump forward
  }

  function connect() {
    ws = new WebSocket(`ws://${location.hostname}:${AUDIO_PORT}/`);
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => { status.textContent = 'connecting…'; };
    ws.onmessage = (e) => {
      if (typeof e.data === 'string') { const h = JSON.parse(e.data); if (h.rate) rate = h.rate; setupRing(); return; }
      if (!ring) return;
      const pcm = new Int16Array(e.data);
      bytes += e.data.byteLength;
      for (let i = 0; i < pcm.length; i += 8) peak = Math.max(peak, Math.abs(pcm[i]));
      push(pcm);
    };
    ws.onclose = () => {
      if (!ctx) return;
      status.textContent = 'no sound stream – retrying';
      retry = setTimeout(connect, 2000);
    };
  }

  function start() {
    ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000, latencyHint: 'interactive' });
    rate = ctx.sampleRate; setupRing();
    // ScriptProcessor works on plain http:// (AudioWorklet would need https).
    node = ctx.createScriptProcessor(1024, 0, 2);
    node.onaudioprocess = (e) => {
      const L = e.outputBuffer.getChannelData(0), R = e.outputBuffer.getChannelData(1), n = L.length;
      if (priming && buffered() >= Math.floor(TARGET * rate) * 2) priming = false;
      if (priming || buffered() < n * 2) {
        L.fill(0); R.fill(0); priming = true;
        if (ctx.currentTime - lastReport >= 1) { status.textContent = bytes ? 'sound on · buffering…' : 'sound on · waiting for audio from the server…'; lastReport = ctx.currentTime; bytes = 0; }
        return;
      }
      for (let i = 0; i < n; i++) { L[i] = ring[rd]; R[i] = ring[(rd + 1) % size]; rd = (rd + 2) % size; }
      const now = ctx.currentTime;
      if (now - lastReport >= 0.5) {
        const db = peak > 0 ? Math.round(20 * Math.log10(peak / 32768)) + ' dB' : 'silent';
        status.textContent = `sound on · ${Math.round(bytes / 1024 / (now - lastReport))} kB/s · level ${db} · ${Math.round(buffered() / 2 / rate * 1000)} ms buffer · ${ctx.sampleRate} Hz`;
        bytes = 0; peak = 0; lastReport = now;
      }
    };
    node.connect(ctx.destination);
    connect();
    box.classList.add('on'); btn.textContent = '🔇 Sound off';
  }

  function stop() {
    clearTimeout(retry);
    const c = ctx; ctx = null;
    if (ws) { ws.onclose = null; ws.close(); ws = null; }
    if (node) { node.disconnect(); node = null; }
    if (c) c.close();
    box.classList.remove('on'); btn.textContent = '🔊 Sound on'; status.textContent = 'sound off';
  }

  btn.addEventListener('click', () => {
    ctx ? stop() : start();
    document.getElementById('vnc').focus();   // keep keyboard input in the simulator
  });
})();
</script>
</body>
</html>
