# Native AwesomeKick simulator builds for macOS (universal: Apple Silicon + Intel) and Windows (x64).
# Every push that touches the code builds both and keeps the zips as workflow artifacts;
# a tag v* additionally publishes them as a GitHub release.
name: Desktop builds

on:
  push:
    branches: [ linux ]
    tags: [ "v*" ]
    paths: [ "Kick/**", "AudIO/**", "ComProtocol/**", "scripts/package-*", ".github/workflows/desktop.yml" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false   # let a started build finish (macOS runners can take a while to start)

jobs:
  macos:
    runs-on: macos-15-intel   # Apple Silicon runners are often out of capacity; the build is universal anyway
    timeout-minutes: 120
    env:
      # JUCE 7 uses CGWindowListCreateImage, which the macOS 15 SDK only allows for older targets.
      # The variable also reaches JUCE's own helper build (juceaide), which ignores CMAKE_OSX_DEPLOYMENT_TARGET.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .3rdPartySourceCache
          key: cpm-macos-${{ hashFiles('Kick/get_cpm.cmake', 'Kick/CMakeLists.txt', 'Kick/modules/CMakeLists.txt') }}
      - name: Tools
        run: brew list ninja >/dev/null 2>&1 || brew install ninja
      - name: Configure
        run: >
          cmake -S Kick -B Kick/build/sim -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DKICK_SIMULATOR=ON -DTIMESTAMP=OFF "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
      - name: Build
        run: cmake --build Kick/build/sim --target KT_KickEM -j "$(sysctl -n hw.ncpu)"
      - name: Package
        run: bash scripts/package-macos.sh
      - name: Smoke test (starts, quits on its own)
        continue-on-error: true   # a CI Mac may have no audio device / asks for the microphone
        run: |
          cd dist/AwesomeKick.app/Contents/MacOS
          KICKEM_SELFTEST=makedemo ./KT_KickEM > ../../../makedemo.log 2>&1 &
          pid=$!
          for i in $(seq 1 90); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          cat ../../../makedemo.log | grep -E "SELFTEST|sandbox|CRASH|audio" || true
          grep -q "saved: yes" ../../../makedemo.log
      - uses: actions/upload-artifact@v4
        with:
          name: AwesomeKick-macOS
          path: dist/AwesomeKick-macOS.zip

  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .3rdPartySourceCache
          key: cpm-windows-${{ hashFiles('Kick/get_cpm.cmake', 'Kick/CMakeLists.txt', 'Kick/modules/CMakeLists.txt') }}
      - name: Configure
        run: cmake -S Kick -B Kick/build/sim -G "Visual Studio 17 2022" -A x64 -DKICK_SIMULATOR=ON -DTIMESTAMP=OFF
      - name: Build
        run: cmake --build Kick/build/sim --config Release --target KT_KickEM -- /m
      - name: Package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AwesomeKick-Windows
          path: dist/AwesomeKick-Windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ macos, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}" dist/*.zip --repo "${GITHUB_REPOSITORY}"
          --title "AwesomeKick ${GITHUB_REF_NAME}" --notes "AwesomeKick simulator for macOS (Apple Silicon + Intel) and Windows x64. See README for first-start notes."
